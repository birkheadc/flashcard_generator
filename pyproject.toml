[project]
name = "flashcard-generator"
version = "0.1.0"
description = "Language flashcard bootstrapper — build Anki decks from listening material"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "soundfile>=0.12",
    "numpy>=1.26",
    "qtawesome>=1.4.2",
    "genanki>=0.13.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
